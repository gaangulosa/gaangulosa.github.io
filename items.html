<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechStore - Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h1>TechStore</h1>
        <button onclick="logout()" style="width: auto; background: #e74c3c; padding: 5px 15px;">Logout</button>
    </nav>

    <div class="product-grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/150?text=Phone+Pro" alt="Phone">
            <h3>Galaxy X1</h3>
            <p class="price">$899.00</p>
            <button onclick="purchase('Galaxy X1')">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150?text=Phone+Mini" alt="Phone">
            <h3>iPhone 15 Nano</h3>
            <p class="price">$699.00</p>
            <button onclick="purchase('iPhone 15 Nano')">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150?text=Foldable" alt="Phone">
            <h3>Pixel Fold Lite</h3>
            <p class="price">$1,099.00</p>
            <button onclick="purchase('Pixel Fold Lite')">Buy Now</button>
        </div>
    </div>

    <script>
        // Security Check: If not logged in, kick back to login page
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        function purchase(itemName) {
            alert('Thank you! You have successfully purchased the ' + itemName + '.');
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
