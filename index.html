    <style>
        /* Combined Global Styles */
        body { background: #f6f8fa; font-family: 'Segoe UI', Arial, sans-serif; color: #222; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Navigation Tabs */
        nav { width: 100%; background: #2c3e50; padding: 0 2rem; display: flex; justify-content: center; margin-bottom: 20px;}
        .tab-button { background: none; color: #aeb6bf; border: none; padding: 1.5rem 2rem; font-size: 1.1rem; cursor: pointer; transition: 0.3s; border-bottom: 4px solid transparent; }
        .tab-button:hover { color: white; }
        .tab-button.active { color: white; border-bottom: 4px solid #2d6cdf; font-weight: bold; }

        /* Tab Content */
        .tab-content { display: none; width: 100%; max-width: 1200px; padding: 0 2rem 2rem 2rem; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Questionnaire Form Styles */
        h1 { text-align: center; color: #2d6cdf; font-size: 2.2em; letter-spacing: 1px; margin-top: 20px; }
        p.subtitle { text-align: center; color: #555; margin-bottom: 30px; }
        form { background: #fff; max-width: 700px; margin: 0 auto; padding: 32px 36px 24px 36px; border-radius: 12px; box-shadow: 0 4px 24px rgba(44, 62, 80, 0.08); border: 1px solid #e3e7ed; }
        form input[type="text"], form input[type="email"], form textarea { width: 100%; padding: 12px 14px; margin-top: 8px; margin-bottom: 24px; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 1em; background: #f9fbfc; transition: border 0.2s; box-sizing: border-box; resize: vertical; }
        form input[type="text"]:focus, form input[type="email"]:focus, form textarea:focus { border: 1.5px solid #2d6cdf; outline: none; background: #fff; }
        form input[type="submit"] { background: linear-gradient(90deg, #2d6cdf 60%, #4f8cff 100%); color: #fff; border: none; border-radius: 6px; padding: 12px 32px; font-size: 1.1em; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(44, 62, 80, 0.07); transition: background 0.2s, box-shadow 0.2s; width: 100%; }
        form input[type="submit"]:hover { background: linear-gradient(90deg, #1b4fa0 60%, #2d6cdf 100%); box-shadow: 0 4px 16px rgba(44, 62, 80, 0.12); }

        /* Product Grid Styles */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-top: 30px; }
        .product-card { background: white; padding: 1.5rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 24px rgba(44, 62, 80, 0.08); border: 1px solid #e3e7ed; }
        .product-card img { max-width: 100%; height: 150px; object-fit: contain; margin-bottom: 1rem; }
        .price { font-size: 1.2rem; font-weight: bold; color: #27ae60; margin: 10px 0; }
        button.buy-btn { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1em; font-weight: 600; transition: background 0.3s; }
        button.buy-btn:hover { background-color: #219150; }

        @media (max-width: 800px) {
            form { max-width: 95vw; padding: 18px 8vw; }
            h1 { font-size: 1.4em; }
        }
    </style>

<body> 
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NH9NG8KZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <nav>
        <button class="tab-button active" onclick="switchTab('questionnaire', 'Home Questionnaire')">Questionnaire</button>
        <button class="tab-button" onclick="switchTab('shop', 'Tech Shop')">Tech Shop</button>
    </nav>

    <div id="questionnaire" class="tab-content active">
        <h1>What is your favorite place to travel?</h1> 
        <p class="subtitle">I am building a directory of the sweetest travel destinations.</p>  
        
        <form name="travel" onsubmit="submitQuestionnaire(event)">
            <label>What is your favorite travel destination?</label>
            <input name="destination" required type="text"/> 
            
            <label>Any recommendations (cool things to do, places to visit or restaurants to eat)?</label>
            <textarea name="details" required rows="5"></textarea> 
            
            <label>Name:</label>
            <input name="fullname" required type="text"/> 
            
            <label>Email:</label>
            <input name="email" required type="email"/> 
            
            <input name="submit" type="submit" value="Submit Destination"/>
        </form> 
    </div>

    <div id="shop" class="tab-content">
        <h1 style="color: #27ae60;">Tech Accessories</h1>
        <p class="subtitle">Gear up for your next trip.</p>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://zyrontech.com.au/cdn/shop/files/powaflex-20000mah-power-bank-941913.jpg?v=1726767719&width=1500" alt="Power Bank">
                <h3>Travel Power Bank</h3>
                <p class="price">$49.99</p>
                <button class="buy-btn" onclick="purchaseItem('Travel Power Bank', 49.99)">Buy Now</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150?text=Headphones" alt="Headphones">
                <h3>Noise Cancelling Headphones</h3>
                <p class="price">$199.00</p>
                <button class="buy-btn" onclick="purchaseItem('Noise Cancelling Headphones', 199.00)">Buy Now</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150?text=Adapter" alt="Adapter">
                <h3>Universal Travel Adapter</h3>
                <p class="price">$25.50</p>
                <button class="buy-btn" onclick="purchaseItem('Universal Travel Adapter', 25.50)">Buy Now</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // Global variables
        const userid = crypto.randomUUID();

        // 1. Tab Switching Logic
        function switchTab(tabId, pageName) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            
            if(tabId === 'questionnaire') document.querySelectorAll('.tab-button')[0].classList.add('active');
            if(tabId === 'shop') document.querySelectorAll('.tab-button')[1].classList.add('active');

            // Track page view on tab change
            analytics.page(pageName);
        }

        // 2. Questionnaire Submission Logic
        function submitQuestionnaire(e){
            e.preventDefault();
            var form = e.target;
            var email = form["email"].value;
            var fullname = form["fullname"].value;
            var destination = form["destination"].value;
            var details = form["details"].value;
            
            var user = {
                email: email, 
                name: fullname, 
                destination: destination, 
                details: details
            };
            
            analytics.identify(userid, {
                email: email, 
                name: fullname
            });
            
            analytics.track('destination submitted', user, function() {
                // Replaced window.location.href reload with a form reset for SPA behavior
                alert('Thank you! Your destination has been submitted.');
                form.reset();
            });
            
            analytics.debug(true);
        }

        // 3. E-Commerce Purchase Logic
        function purchaseItem(itemName, itemPrice) {
            alert('Thank you! You have ordered: ' + itemName);

            // Trigger the Segment track call EXACTLY as requested
            analytics.track("Item Ordered", {
                item: itemName,
                price: parseFloat(itemPrice) // Ensures price is tracked as a number
            });
        }
    </script>
</body> 
</html>
